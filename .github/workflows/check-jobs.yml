name: Check new grad design jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Prevent two runs from racing on state.json (e.g. a manual trigger
# overlapping the hourly schedule) -- queue instead of running concurrently.
concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached && exit 0
          git commit -m "Update seen job listings state"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Failed to push updated state after retries" >&2
          exit 1
